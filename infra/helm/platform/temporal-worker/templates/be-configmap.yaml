apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-temporal-worker-configmap
  #namespace: {{ .Values.global.namespace }}
data:
  # role: {{ .Values.global.role }}
  # mode: {{ .Values.global.mode }}

{{- range $key, $value:= .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
immutable: false
