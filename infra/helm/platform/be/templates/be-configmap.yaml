apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-be-configmap
  #namespace: {{ .Values.global.namespace }}
data:
  # role: {{ .Values.global.role }}
  # mode: {{ .Values.global.mode }}
  FLAREWARD_BIND_PORT: {{ .Values.service.port | quote}}
{{- range $key, $value:= .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
immutable: false
