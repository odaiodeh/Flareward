name: Python dependency audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: platform
            python: '3.14'
            extras: api,credentials,blueprints,temporal,telemetry
          - component: identity
            python: '3.11'
            extras: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout pinned Run Engine
        if: ${{ matrix.component == 'platform' }}
        uses: actions/checkout@v4
        with:
          repository: redhat-community-ai-tools/run-engine
          ref: 60393440efd3876cd6c81e0b013e8bf6d9167659
          path: .run-engine-build
      - name: Install retained application
        run: |
          python -m venv venv
          if [ '${{ matrix.component }}' = platform ]; then
            venv/bin/pip install './.run-engine-build[temporal]'
          fi
          venv/bin/pip install "./packages/service-support[${{ matrix.component }}]" "./${{ matrix.component }}[${{ matrix.extras }}]" pip-audit
      - name: Audit installed dependencies
        run: venv/bin/pip-audit
