[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumora-platform"
version = "0.1.0"
description = "Lumora composable Program platform"
requires-python = ">=3.14"
license = {text = "Proprietary"}

dependencies = [
    "pydantic>=2.12",
    "pydantic-core",
    "pyyaml",
    "python-dotenv",
    "typer",
    "runengine>=0.2,<0.3",
    "jsonschema>=4.23",
    "referencing>=0.36,<1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "itsdangerous>=2.2",
    "pydantic-settings>=2.7", "pymongo>=4.11", "redis>=5",
    "cryptography>=43",
]
blueprints = ["a2a-sdk>=0.3,<1"]
credentials = ["authlib>=1.3", "cryptography>=43", "pymongo>=4.11"]
dev = ["lumora-platform[api,blueprints,credentials,temporal,mcp,telemetry,openai,gemini,tools]", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=2,<3", "types-jsonschema>=4.23"]
e2e = ["lumora-platform[dev]", "runengine[kubernetes,openshell]>=0.2,<0.3", "openshell>=0.0.104"]
mongo = ["pymongo>=4.11"]
temporal = ["runengine[temporal]>=0.2,<0.3", "temporalio>=1.35,<2"]
langgraph = ["langgraph", "langchain", "langchain-core", "deepagents"]
openai = ["openai>=2,<3"]
gemini = ["google-genai>=2.34,<3"]
llms = ["lumora-platform[openai,gemini]", "langchain-openai", "langchain-google-genai"]
mcp = ["mcp>=1.30,<2", "yarl>=1.20"]
tools = ["lumora-platform[mcp]", "paramiko", "openshift-client", "httptools", "safehttpx", "html-to-markdown", "anyio", "authlib"]
a2a = ["a2a-sdk[all]<1.0", "typing-inspection"]
claude = ["claude-agent-sdk>=0.2.0", "anthropic[vertex]>=0.40.0"]
redis = ["redis"]
tracing = ["langfuse>=3.0.0"]
telemetry = ["opentelemetry-sdk>=1.45,<2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
all = [
    "lumora-platform[api,credentials,mongo,temporal,langgraph,llms,tools,a2a,claude,redis,tracing,telemetry]",
]
test = ["pytest>=6.0"]

[project.scripts]
lumora-platform = "lumora.bootstrap.http_cli:main"

# One source root; core contracts and feature-owned plugins are separate namespaces.
[tool.setuptools.packages.find]
where = ["src"]
include = ["lumora", "lumora.*", "plugins", "plugins.*"]

[tool.setuptools.package-data]
"lumora.bootstrap.settings" = ["policies/*.json"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "tests"]
addopts = "-v --tb=short --strict-markers --disable-warnings --color=yes --import-mode=importlib"
console_output_style = "progress"
junit_family = "xunit2"
minversion = "6.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests (isolated component testing)",
    "integration: Integration tests (multi-component testing)",
    "e2e: End-to-end tests (complete system testing)",
    "agent_system: Agent reasoning and execution system tests",
    "llm_integration: LLM provider integration tests",
    "tool_execution: Tool management and execution tests",
    "graph_engine: Workflow graph execution tests",
    "session_management: User session and state management tests",
    "fast: Fast running tests (< 1s)",
    "slow: Slow running tests (> 5s)",
    "stable: Stable, reliable tests",
    "flaky: Potentially unstable tests",
    "smoke: Smoke tests for basic functionality",
    "regression: Regression tests for bug fixes",
    "performance: Performance and load tests",
    "asyncio: Async tests (pytest-asyncio)",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
