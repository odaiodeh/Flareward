[openshell]
version = 1

[openshell.gateway]
bind_address = "0.0.0.0:8090"
log_level = "info"
compute_drivers = ["docker"]
disable_tls = false

[openshell.gateway.auth]
allow_unauthenticated_users = false

[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell/pki/signing.pem"
public_key_path = "/etc/openshell/pki/public.pem"
kid_path = "/etc/openshell/pki/kid"
gateway_id = "lumora-e2e"
ttl_secs = 0

[openshell.drivers.docker]
default_image = "lumora-sandbox:rename-20261110"
supervisor_image = "ghcr.io/nvidia/openshell/supervisor:0.0.103"
image_pull_policy = "IfNotPresent"
sandbox_namespace = "lumora-e2e"
grpc_endpoint = "https://host.openshell.internal:8090"
guest_tls_ca = "{{STATE_DIR}}/pki/ca.crt"
guest_tls_cert = "{{STATE_DIR}}/pki/guest.crt"
guest_tls_key = "{{STATE_DIR}}/pki/guest.key"

