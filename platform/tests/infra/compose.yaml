name: flareward-e2e

services:
  mongo-transactions:
    image: mongo:8
    profiles: ["transactions"]
    command: ["mongod", "--replSet", "flareward", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (error) { rs.initiate({_id:'flareward',members:[{_id:0,host:'mongo-transactions:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${FLAREWARD_E2E_MONGO_TRANSACTION_PORT:-27019}:27017"
  mongo:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${FLAREWARD_E2E_MONGO_PORT:-27018}:27017"
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${FLAREWARD_E2E_REDIS_PORT:-6380}:6379"
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--headless"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${FLAREWARD_E2E_TEMPORAL_PORT:-7234}:7233"
  gateway:
    profiles: ["openshell"]
    image: ghcr.io/nvidia/openshell/gateway:0.0.103
    user: "0"
    command:
      - --tls-cert
      - /etc/openshell/pki/server.crt
      - --tls-key
      - /etc/openshell/pki/server.key
      - --tls-client-ca
      - /etc/openshell/pki/ca.crt
      - --enable-mtls-auth
      - "true"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${FLAREWARD_E2E_STATE_DIR:?Run prepare.py and set an absolute state directory}:${FLAREWARD_E2E_STATE_DIR}"
      - "${FLAREWARD_E2E_STATE_DIR}/gateway.toml:/etc/openshell/gateway.toml:ro"
      - "${FLAREWARD_E2E_STATE_DIR}/pki:/etc/openshell/pki:ro"
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:${FLAREWARD_E2E_STATE_DIR}/gateway.db?mode=rwc"
      HOME: "${FLAREWARD_E2E_STATE_DIR}"
      XDG_DATA_HOME: "${FLAREWARD_E2E_STATE_DIR}"

